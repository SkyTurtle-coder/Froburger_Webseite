services:
  db:
    image: postgres:17-alpine
    container_name: froburger-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-froburger}
      POSTGRES_USER: ${POSTGRES_USER:-froburger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-froburger-dev-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
