[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
  ".venv",
  "output",
  "reports",
  "Screenshots",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
