<article class="post-layout post-layout-classic">
  <div class="container">
    <p class="breadcrumbs"><a href="{% url 'core:home' %}">Home</a> / <a href="{{ news_index_url }}">Aktuelles</a> / {{ post.title }}</p>
    <div class="post-layout-meta">
      {% if post.event_date %}
        <time datetime="{{ post.event_date|date:'Y-m-d' }}">{{ post.event_date|date:"j. F Y" }}</time>
      {% elif post.published_at %}
        <time datetime="{{ post.published_at|date:'Y-m-d' }}">{{ post.published_at|date:"j. F Y" }}</time>
      {% endif %}
    </div>
    <h1>{{ post.title }}</h1>
    <p class="post-layout-summary">{{ post.teaser }}</p>
    <hr class="post-layout-rule">
    <div class="post-layout-body post-richtext">
      {{ post_body_html|safe }}
    </div>
    <p class="post-layout-back"><a class="text-link" href="{{ news_index_url }}">Zurueck zu allen Beitraegen &uarr;</a></p>
  </div>
</article>
